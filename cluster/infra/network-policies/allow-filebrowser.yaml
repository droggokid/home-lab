apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-filebrowser
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: filebrowser
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
