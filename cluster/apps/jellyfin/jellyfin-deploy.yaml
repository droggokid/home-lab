apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: apps
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
            - containerPort: 8920
              name: https
          env:
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: movies
              mountPath: /media/movies
            - name: series
              mountPath: /media/series
            - name: data
              mountPath: /config
              subPath: config
            - name: data
              mountPath: /cache
              subPath: cache
      volumes:
        - name: movies
          hostPath:
            path: /data/storage/media/movies
            type: Directory
        - name: series
          hostPath:
            path: /data/storage/media/series
            type: Directory
        - name: data
          persistentVolumeClaim:
            claimName: jellyfin-data
