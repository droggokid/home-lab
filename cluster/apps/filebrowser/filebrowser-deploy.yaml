apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          ports:
            - containerPort: 80
          args:
            - "--port=80"
            - "--root=/srv"
            - "--database=/database/filebrowser.db"
            - "--config=/config/settings.json"
          envFrom:
            - secretRef:
                name: filebrowser-auth
          volumeMounts:
            - name: storage
              mountPath: /srv
            - name: data
              mountPath: /database
              subPath: database
            - name: data
              mountPath: /config
              subPath: config
      volumes:
        - name: storage
          hostPath:
            path: /data/storage/files
            type: Directory
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data
