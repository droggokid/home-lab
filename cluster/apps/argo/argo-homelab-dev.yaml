apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-dev
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/droggokid/home-lab
    targetRevision: main
    path: cluster/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      name: postgres-credentials
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: temporal-postgres
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
