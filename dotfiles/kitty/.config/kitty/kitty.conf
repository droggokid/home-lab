# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family "JetBrains Mono" 
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

enable_mouse yes
# Animated cursor
cursor_trail 15
cursor_trail_decay 0.02 0.06
cursor_trail_start_threshold 4
# change to x11 or wayland or leave auto
linux_display_server auto 

scrollback_lines 10000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 8 

remember_window_size no 
initial_window_width 94c 
initial_window_height 30c 

hide_window_decorations no
always_show_tab_bar yes
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

# selection_foreground none
# selection_background none
# foreground #dddddd
# background #000000
# cursor #dddddd

# Custom maps
map ctrl+shift+d detach_window

# BEGIN_KITTY_THEME
# Monokai
include current-theme.conf
# END_KITTY_THEME
allow_remote_control yes
