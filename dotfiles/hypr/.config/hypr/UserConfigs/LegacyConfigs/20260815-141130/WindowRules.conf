# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi

# OSRS / RuneLite performance overrides
windowrule = match:class ^(RuneScape)$, no_blur on
windowrule = match:class ^(RuneScape)$, opacity 1 override 1 override
windowrule = match:class ^(RuneScape)$, content game
windowrule = match:class ^(net-runelite-client-RuneLite|RuneScape)$, immediate on

# JetBrains IDEs (IntelliJ IDEA and other JetBrains IDEs)
windowrule = match:class ^(jetbrains-.*|idea)$, no_blur on
windowrule = match:class ^(jetbrains-.*|idea)$, opacity 1 override 1 override
