animations {
    enabled = true
    # Animation curves (reduced set)
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = liner, 1, 1, 1, 1
    
    # Animation configs (minimal - optimized for performance)
    animation = border, 1, 1, liner
    animation = windows, 1, 3, wind, slide
    animation = windowsIn, 1, 3, wind, slide
    animation = windowsOut, 1, 2, wind, slide
    animation = fade, 1, 2, liner
    animation = workspaces, 1, 4, wind
}


